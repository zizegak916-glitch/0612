name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/ip_inspector.py formats

  desktop-package:
    name: Desktop package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: windows-latest
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pyinstaller keyring
      - run: python -c "import tkinter; print('Tk OK')"
      - run: python -m PyInstaller --clean --paths src --onefile --name ipbatch-cli scripts/ip_inspector.py
      - run: python -m PyInstaller --clean --paths src --onefile --windowed --name IPBatchInspector apps/desktop/launcher.py
      - name: Stage Unix assets
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          mv dist/ipbatch-cli package/ipbatch-cli-${{ matrix.suffix }}
          mv dist/IPBatchInspector package/IPBatchInspector-${{ matrix.suffix }}
      - name: Stage Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Move-Item dist/ipbatch-cli.exe package/ipbatch-cli-${{ matrix.suffix }}.exe
          Move-Item dist/IPBatchInspector.exe package/IPBatchInspector-${{ matrix.suffix }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.suffix }}
          path: package/*

  android:
    name: Android native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            apps/android/app/libs/libbox.aar
            apps/android/app/libs/libbox.aar.sha256
          key: android-libbox-v1.14.0-0b8995879f29a9b98ee027bc17b75e101445b238-r1
      - name: Build and run Android smoke tests
        working-directory: apps/android
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/build/IPBatchInspector-v*-android-debug.apk

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned simulator app
        working-directory: apps/ios
        run: |
          xcodebuild -project IPBatchInspector.xcodeproj -scheme IPBatchInspector -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/IPBatchInspector.app IPBatchInspector-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: apps/ios/IPBatchInspector-ios-simulator.zip

  boundary:
    name: Subscription network boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify resolver never receives node ports
        run: python -m unittest tests.test_iptools.IpToolsTest.test_node_port_never_enters_resolver -v
        env:
          PYTHONPATH: src
      - name: Enforce Android system-VPN and ordinary-mode separation
        run: |
          grep -nE 'android\.net\.VpnService' apps/android/app/src/main/java/com/fool/ipbatch/SystemVpnService.java
          grep -nE 'android\.permission\.BIND_VPN_SERVICE' apps/android/app/src/main/AndroidManifest.xml
          grep -nE 'protect\(fd\)' apps/android/app/src/main/java/com/fool/ipbatch/SystemVpnService.java
          grep -nE '拒绝私网/保留节点服务器|节点域名解析到私网/保留地址' apps/android/app/src/main/java/com/fool/ipbatch/SingBoxConfigBuilder.java
          if grep -nE 'SystemVpnService|CommandServer|startOrReloadService' \
              apps/android/app/src/main/java/com/fool/ipbatch/SubscriptionParser.java \
              apps/android/app/src/main/java/com/fool/ipbatch/SubscriptionResolver.java \
              apps/android/app/src/main/java/com/fool/ipbatch/ScanForegroundService.java; then
            echo 'Ordinary subscription path references real VPN APIs.' >&2
            exit 1
          fi
          if grep -R -nE --include='*.swift' 'NEPacketTunnelProvider|NEDNSProxyProvider' apps/ios; then
            echo 'iOS tunnel APIs are not implemented in this Android-only milestone.' >&2
            exit 1
          fi
      - name: Validate userscript syntax and no node-connection primitives
        run: |
          node --check userscript/IPBatchInspector.user.js
          if grep -nE 'WebSocket|RTCPeerConnection|ProxyService' userscript/IPBatchInspector.user.js; then
            echo 'Forbidden node-connection primitive found in userscript.' >&2
            exit 1
          fi
