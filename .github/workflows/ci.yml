name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/ip_inspector.py formats

  desktop-package:
    name: Desktop package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: windows-latest
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      IPBATCH_VERSION: 6.0.0-alpha.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install --upgrade pyinstaller keyring
      - run: python -c "import tkinter; print('Tk OK')"
      - run: python -m PyInstaller --clean --paths src --onefile --name ipbatch-cli scripts/ip_inspector.py
      - run: python -m PyInstaller --clean --paths src --onefile --windowed --name IPBatchInspector apps/desktop/launcher.py
      - name: Build Linux DEB and portable archive
        if: runner.os != 'Windows'
        run: ./packaging/linux/build_packages.sh "$IPBATCH_VERSION"
      - name: Build Windows Setup and portable executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts\install_service_windows.ps1 -Raw)) | Out-Null
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force release | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$env:IPBATCH_VERSION" "packaging\windows\IPBatchInspector.iss"
          Copy-Item dist\IPBatchInspector.exe "release\IPBatchInspector-$env:IPBATCH_VERSION-Windows-x64-portable.exe"
          Copy-Item dist\ipbatch-cli.exe "release\ipbatch-cli-$env:IPBATCH_VERSION-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.suffix }}
          path: release/*

  terminal-package:
    name: Python, terminal scripts and userscript
    runs-on: ubuntu-latest
    env:
      IPBATCH_VERSION: 6.0.0-alpha.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Stage Python, terminal and Tampermonkey packages
        run: |
          mkdir -p release script-bundle
          cp dist/*.whl dist/*.tar.gz release/
          cp -R scripts src pyproject.toml README.md LICENSE monitor.example.json packaging/systemd script-bundle/
          (cd script-bundle && zip -qr "../release/IPBatchInspector-$IPBATCH_VERSION-terminal-scripts.zip" .)
          cp userscript/IPBatchInspector.user.js "release/IPBatchInspector-$IPBATCH_VERSION.user.js"
          node --check "release/IPBatchInspector-$IPBATCH_VERSION.user.js"
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-python-userscript
          path: release/*

  android:
    name: Android native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and run Android smoke tests
        working-directory: apps/android
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/build/IPBatchInspector-v*-android-debug.apk

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned simulator app
        working-directory: apps/ios
        run: |
          xcodebuild -project IPBatchInspector.xcodeproj -scheme IPBatchInspector -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Debug-iphonesimulator/IPBatchInspector.app IPBatchInspector-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: apps/ios/IPBatchInspector-ios-simulator.zip

  boundary:
    name: Subscription network boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify resolver never receives node ports
        run: python -m unittest tests.test_iptools.IpToolsTest.test_node_port_never_enters_resolver -v
        env:
          PYTHONPATH: src
      - name: Verify only literal subscription IPs enter investigation
        run: python -m unittest tests.test_iptools.IpToolsTest.test_only_literal_subscription_ips_are_investigated -v
        env:
          PYTHONPATH: src
      - name: Enforce investigation-only product boundary
        run: |
          if grep -R -nE --include='*.java' --include='AndroidManifest.xml' \
              'android\.net\.VpnService|BIND_VPN_SERVICE|io\.nekohasekai|libbox|SystemVpnService' apps/android; then
            echo 'Android VPN or embedded proxy-core code remains.' >&2
            exit 1
          fi
          if grep -R -nE --include='*.py' --include='*.swift' --include='*.js' \
              'realSubscriptionTest|real_subscription_test|controllerJSON|controllerJson|MihomoController|/proxies/' \
              src apps userscript; then
            echo 'Proxy controller or real-node test code remains.' >&2
            exit 1
          fi
      - name: Validate userscript syntax and no node-connection primitives
        run: |
          node --check userscript/IPBatchInspector.user.js
          bash -n scripts/ipbatch.sh scripts/install_service_linux.sh packaging/linux/ipbatch-enable-monitor
          if grep -nE 'WebSocket|RTCPeerConnection|ProxyService' userscript/IPBatchInspector.user.js; then
            echo 'Forbidden node-connection primitive found in userscript.' >&2
            exit 1
          fi
